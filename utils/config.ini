[AUDIO]
sample_rate = 16000
channels = 1
chunk = 1024

[CLIPBOARD]
paste_delay = 0.1

[EDITOR]
width = 400
height = 700
font_name = MS Gothic
font_size = 12

[GOOGLE_STT]
model = chirp_3
language = ja-JP
phrase_set_file = technical_terms.txt
phrase_boost = 5.0
enable_automatic_punctuation = True

[FORMATTING]
use_punctuation = True
use_comma = True

[KEYS]
toggle_recording = pause
exit_app = esc
reload_audio = f8
toggle_punctuation = f9

[LOGGING]
log_retention_days = 7
log_directory = logs
log_level = INFO
debug_mode = False
project_name = VoiceTrans

[OPTIONS]
start_minimized = True

[PATHS]
replacements_file = replacements.txt
temp_dir = C:\Shinseikai\VoiceTrans\temp
cleanup_minutes = 10

[RECORDING]
auto_stop_timer = 60

[WINDOW]
width = 300
height = 450